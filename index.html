<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StevenTV - Watch Free Movies & TV Shows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation Drawer Menu panel -->
        <aside class="sidebar">
            <h1 class="logo">Steven<span>TV</span></h1>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active">🏠 Home Catalog</a>
                <a href="#" class="menu-item" id="open-admin-btn" style="margin-top: 20px; color: #00df89;">🔑 Admin Console</a>
            </nav>
        </aside>

        <!-- Right Content Main Display Canvas -->
        <main class="main-content">
            <!-- Global Top Navigation bar Controls -->
            <header class="top-nav">
                <input type="text" id="search-bar" placeholder="Search your catalog...">
            </header>

            <!-- Video Cinema Projection Stage -->
            <div class="cinema-stage hidden" id="cinema-stage">
                <div class="video-wrapper">
                    <video id="main-video" controls></video>
                    <button class="close-cinema-btn" id="close-cinema-btn">✕ Close Player</button>
                </div>
                <div class="cinema-details">
                    <h2 id="cinema-title">Movie Title</h2>
                    <p id="cinema-description">Description summary tags info.</p>
                </div>
            </div>

            <!-- Media Collection Showcase Rows Grid -->
            <section class="rows-container">
                <h3 style="margin-bottom: 15px;">Your Movie Collection</h3>
                <div class="row-scroll-container" id="grid-movies"></div>
            </section>
        </main>
    </div>

    <!-- Administrative Management Password Entry Popup Modal Overlay -->
    <div class="admin-modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>StevenTV Admin Panel</h3>
                <button id="close-admin-btn" class="close-btn">&times;</button>
            </div>
            
            <!-- Auth validation screening Zone -->
            <div id="admin-auth-zone">
                <p style="margin-bottom: 10px;">Enter passcode:</p>
                <input type="password" id="admin-pass-input" placeholder="••••••••">
                <button id="btn-authorize" class="submit-btn">Verify</button>
                <p id="auth-error-msg" class="error-text"></p>
            </div>
            
            <!-- Upload Management Interface console deployment form -->
            <form id="upload-form" class="hidden">
                <div class="form-group">
                    <label>Movie Title</label>
                    <input type="text" id="form-title" required>
                </div>
                <div class="form-group">
                    <label>Select Movie (.mp4)</label>
                    <input type="file" id="form-video" accept="video/mp4" required>
                </div>
                <div class="form-group">
                    <label>Select Thumbnail (.jpg/.png)</label>
                    <input type="file" id="form-thumb" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="form-desc" rows="3" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Save Movie</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
