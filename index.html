<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StevenTV - Stream Free Premium Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left"><h1 class="logo">StevenTV</h1></div>
        <div class="nav-right"><button class="admin-btn" id="open-admin-btn">🔒 Admin</button></div>
    </header>
    <main class="hero-cinema">
        <div class="video-wrapper"><video id="main-video" controls></video></div>
        <div class="hero-details"><h2 id="movie-title">Select a Movie</h2><p id="movie-description"></p></div>
    </main>
    <section class="catalog-section"><div class="movie-grid" id="movie-grid"></div></section>
    <section class="request-section">
        <h3>Request a Movie</h3>
        <form id="request-form">
            <input type="text" id="req-title" placeholder="Movie Title" required>
            <button type="submit">Send Request</button>
        </form>
    </section>
    <div class="admin-modal" id="admin-modal">
        <div class="modal-content">
            <button id="close-admin-btn">&times;</button>
            <form id="upload-form">
                <input type="text" id="form-title" placeholder="Title" required>
                <input type="url" id="form-video" placeholder="Permanent .mp4 URL" required>
                <input type="url" id="form-thumb" placeholder="Poster URL" required>
                <button type="submit">Add Movie</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
