<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StevenTV - Watch Free Movies & TV Shows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Drawer Controls Navigation menu Panel -->
        <aside class="sidebar">
            <h1 class="logo">Steven<span>TV</span></h1>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-filter="all">🏠 All Catalog</a>
                <a href="#" class="menu-item" data-filter="Movie">🎬 Movies</a>
                <a href="#" class="menu-item" data-filter="TV Show">📺 TV Shows</a>
                <a href="#" class="menu-item" data-filter="Animation">🎌 Anime</a>
                <a href="#" class="menu-item" id="open-admin-btn" style="margin-top: 30px; color: #00df89;">🔑 Admin Console</a>
            </nav>
        </aside>

        <!-- Main Display Arena Canvas -->
        <main class="main-content">
            <header class="top-nav">
                <input type="text" id="search-bar" placeholder="Search your local catalog...">
            </header>

            <!-- Video Projections Theater Stage -->
            <div class="cinema-stage hidden" id="cinema-stage">
                <div class="video-wrapper">
                    <video id="main-video" controls>
                        <!-- Dynamic subtitling slot container track link -->
                        <track id="video-track" label="English Captions" kind="subtitles" srclang="en" default>
                    </video>
                    <button class="close-cinema-btn" id="close-cinema-btn">✕ Close Player</button>
                </div>
                <div class="cinema-details">
                    <h2 id="cinema-title">Movie Title</h2>
                    <p id="cinema-description">Description summary tags info.</p>
                </div>
            </div>

            <!-- Dynamic Media Grid Presentation Slots Channels -->
            <section class="rows-container">
                <h3 id="row-dynamic-title" style="margin-bottom: 15px;">Your Movie Collection</h3>
                <div class="row-scroll-container" id="grid-movies"></div>
            </section>
        </main>
    </div>

    <!-- Administrative Management Password Entry Popup Modal Overlay -->
    <div class="admin-modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>StevenTV Admin Panel</h3>
                <button id="close-admin-btn" class="close-btn">&times;</button>
            </div>
            
            <div id="admin-auth-zone">
                <p style="margin-bottom: 10px;">Enter passcode:</p>
                <input type="password" id="admin-pass-input" placeholder="••••••••">
                <button id="btn-authorize" class="submit-btn">Verify</button>
                <p id="auth-error-msg" class="error-text"></p>
            </div>
            
            <form id="upload-form" class="hidden">
                <div class="form-group">
                    <label>Movie Title</label>
                    <input type="text" id="form-title" required>
                </div>
                <div class="form-group">
                    <label>Content Layout Category Mode</label>
                    <select id="form-category" style="width:100%; background:#1c2229; color:white; padding:10px; border-radius:6px; border:1px solid #28313b;">
                        <option value="Movie">Movie Blockbuster</option>
                        <option value="TV Show">TV Show Series</option>
                        <option value="Animation">Anime & Animation</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select Movie Video File (.mp4)</label>
                    <input type="file" id="form-video" accept="video/mp4" required>
                </div>
                <div class="form-group">
                    <label>Select Poster Thumbnail Graphic (.jpg / .png)</label>
                    <input type="file" id="form-thumb" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Select Subtitles Closed Captions File Optional (.vtt)</label>
                    <input type="file" id="form-subtitles" accept=".vtt">
                </div>
                <div class="form-group">
                    <label>Synopses Description details</label>
                    <textarea id="form-desc" rows="3" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Save Media File to Local Storage</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
