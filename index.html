<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StevenTV - Stream Free Premium Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo">StevenTV</h1>
            <input type="text" id="search-bar" placeholder="🔍 Search titles, genres, creators...">
        </div>
        <div class="nav-right">
            <button class="admin-btn" id="open-admin-btn">🔒 Admin Dashboard</button>
        </div>
    </header>

    <!-- Immersive Cinema Hero Display Section -->
    <main class="hero-cinema">
        <div class="video-stage">
            <div class="video-wrapper">
                <video id="main-video" crossorigin="anonymous">
                    <track id="video-track" label="English" kind="subtitles" srclang="en" default>
                </video>
                
                <!-- Custom Control Bar Overlay -->
                <div class="custom-controls">
                    <button class="ctrl-btn" id="btn-back">⏪ 10s</button>
                    <button class="ctrl-btn" id="btn-play">▶️ Play/Pause</button>
                    <button class="ctrl-btn" id="btn-fwd">10s ⏩</button>
                    <button class="ctrl-btn" id="btn-fullscreen">🔲 Fullscreen</button>
                </div>
            </div>
        </div>
        
        <div class="hero-details">
            <div class="meta-row">
                <span id="movie-category" class="badge">Genre</span>
                <span class="ultra-hd">4K Ultra HD</span>
            </div>
            <h2 id="movie-title">Featured Selection</h2>
            <p id="movie-description">Select any movie title below to instantly begin smooth high-definition playback with active subtitles streams.</p>
        </div>
    </main>

    <!-- Main Movie Rows -->
    <section class="catalog-section">
        <h3 class="section-title">Trending blockbusters</h3>
        <div class="movie-grid" id="movie-grid"></div>
    </section>

    <!-- Secure Content Upload Manager Panel Modal -->
    <div class="admin-modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>StevenTV Secure Console</h3>
                <button id="close-admin-btn" class="close-btn">&times;</button>
            </div>
            
            <!-- Password Authorization Sub-view -->
            <div id="admin-auth-zone">
                <p class="auth-prompt">Enter administrative passcode to unlock deployment access:</p>
                <input type="password" id="admin-pass-input" placeholder="••••••••">
                <button id="btn-authorize" class="submit-btn">Verify Credentials</button>
                <p id="auth-error-msg" class="error-text"></p>
            </div>

            <!-- Core Content Creation Matrix (Hidden Until Verified) -->
            <form id="upload-form" class="hidden">
                <div class="form-group">
                    <label>Movie Title</label>
                    <input type="text" id="form-title" required placeholder="e.g., Sintel">
                </div>
                <div class="form-group">
                    <label>Category / Genre</label>
                    <input type="text" id="form-category" required placeholder="e.g., Action / Sci-Fi">
                </div>
                <div class="form-group">
                    <label>Direct Stream URL (.mp4 file link)</label>
                    <input type="url" id="form-video" required placeholder="https://domain.com">
                </div>
                <div class="form-group">
                    <label>Poster Thumbnail Image URL</label>
                    <input type="url" id="form-thumb" required placeholder="https://domain.com">
                </div>
                <div class="form-group">
                    <label>Subtitles File URL (.vtt tracking data)</label>
                    <input type="url" id="form-subtitles" placeholder="https://domain.com">
                </div>
                <div class="form-group">
                    <label>Synopses Description</label>
                    <textarea id="form-desc" rows="3" required placeholder="Provide an engaging logline summary details..."></textarea>
                </div>
                <button type="submit" class="submit-btn security-clearance">Deploy Film Nationwide</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
