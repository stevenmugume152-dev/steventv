<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StevenTV - Permanent Local Streaming Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Left Side Dashboard Drawer Links Navigation panel -->
        <aside class="sidebar">
            <h1 class="logo">Mugu<span>TV</span></h1>
            <nav class="navigation-links">
                <a href="#" class="nav-item active" data-filter="all">🏠 All Content</a>
                <a href="#" class="nav-item" data-filter="Movie">🎬 Movies Only</a>
                <a href="#" class="nav-item" data-filter="Series">📺 TV Shows & Series</a>
                <a href="#" class="nav-item" id="admin-toggle-btn" style="margin-top: 40px; color: #00df89;">⚙️ Admin Upload</a>
            </nav>
        </aside>

        <!-- Right Side Main Content Projection Canvas -->
        <main class="main-stage">
            <header class="top-nav-bar">
                <input type="text" id="catalog-search" placeholder="Type to search your offline vault instantly...">
            </header>

            <!-- Video Player Theater Canvas Box Screen -->
            <div class="player-theater-room hidden" id="video-theater-stage">
                <div class="video-container-box">
                    <video id="theater-player" controls autocomplete="off">
                        <track id="video-track" label="English Captions" kind="subtitles" srclang="en" default>
                    </video>
                    <button class="dismiss-player-btn" id="close-theater-btn">✕ Close Player</button>
                </div>
                <div class="theater-text-details">
                    <h2 id="theater-movie-title">Movie Title</h2>
                    <p id="theater-movie-desc">Description synopsis tag details.</p>
                </div>
            </div>

            <!-- Media Flexible Wrapping Grid Section Canvas Channels -->
            <section class="media-section">
                <h3 id="current-grid-header-title">All Uploaded Content</h3>
                <div class="media-flex-grid" id="catalog-grid-display"></div>
                
                <div class="empty-notice-banner hidden" id="empty-notice-box">
                    <div class="fallback-icon">📂</div>
                    <h4>No Videos Available Here</h4>
                    <p>Open the Admin Upload menu to load your native PC media files into this view category.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Administrative Upload Modal Panel Popup Overlay -->
    <div class="admin-overlay-modal" id="upload-modal-overlay">
        <div class="modal-box">
            <div class="modal-header-bar">
                <h3>MuguTV Management Console</h3>
                <button id="exit-modal-btn" class="close-modal-x">&times;</button>
            </div>
            
            <form id="media-upload-form">
                <div class="form-input-group">
                    <label>Movie / Show Title</label>
                    <input type="text" id="input-title" required placeholder="e.g., Dark">
                </div>
                <div class="form-input-group">
                    <label>Classification Category Type</label>
                    <select id="input-category">
                        <option value="Movie">Movie Blockbuster</option>
                        <option value="Series">TV Show Series</option>
                    </select>
                </div>
                <div class="form-input-group">
                    <label>Select Movie / Episode Video File From PC (.mp4)</label>
                    <input type="file" id="input-video-file" accept="video/mp4" required>
                </div>
                <div class="form-input-group">
                    <label>Select Subtitles File From PC Optional (.vtt)</label>
                    <input type="file" id="input-subtitles-file" accept=".vtt">
                </div>
                <div class="form-input-group">
                    <label>Upload Thumbnail Cover Image File From PC (.jpg / .png)</label>
                    <input type="file" id="input-thumbnail-file" accept="image/*" required>
                </div>
                <div class="form-input-group">
                    <label>Plot Synopsis Description Summary</label>
                    <textarea id="input-description" rows="3" required placeholder="Provide an engaging summary logline details..."></textarea>
                </div>
                <button type="submit" class="modal-submit-btn">Save Permanently To Offline Vault</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
